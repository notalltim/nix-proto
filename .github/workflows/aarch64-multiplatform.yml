name: "aarch64-multiplatform "
on:
  schedule:
    - cron: "12 4 * * *"
  workflow_dispatch:
jobs:
  build-releases:
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        releases: [release-25.11, release-26.05]
    uses: ./.github/workflows/build-multiple.yml
    with:
      nixpkgs: ${{ matrix.releases }}
      architecture: aarch64-multiplatform
      cache: "use"
